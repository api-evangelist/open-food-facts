description: >-
  The entity graph across the Open Food Facts API family, derived from $ref links and id-reference fields in
  the published contracts. Everything hangs off one identifier: the GS1 barcode.
primary_key:
  entity: Product
  field: code
  format: EAN-13 / UPC barcode, normalized per the project's barcode-normalization rules
  note: >-
    There are no opaque prefixed object ids on the core product surface. Companion services mint their own
    integer surrogate keys (price id, proof id, flag id, ticket id) and join back to Product by `code`.
entities:
  - name: Product
    api: Open Food Facts API v2 / v3
    schema: Product
    key: code
    composed_of:
      - Product-Base
      - Product-Misc
      - Product-Tags
      - Product-Images
      - Product-Eco-Score
      - Product-Forest-Footprint-2026
      - Product-Ingredients
      - Product-Nutrition
