      - Product-Nutriscore
      - Product-Quality
      - Product-Extended
      - Product-Metadata
      - Product-Knowledge-Panels
      - Product-Attribute-Groups
    note: >-
      Product is an allOf composition of fifteen facet schemas — the `fields` query parameter selects which
      facets are materialized in a response.
  - name: Ingredient
    api: Open Food Facts API v2
    schema: Ingredient
    note: Self-nesting — sub-ingredients are contained inside their parent ingredient (product schema 997).
  - name: Nutrient
