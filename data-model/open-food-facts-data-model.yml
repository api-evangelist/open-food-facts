  - name: TaxonomyTag
    api: Open Food Facts API v3
    note: Canonical taxonomy identifier, e.g. en:breakfast-cereals. Backed by vocabulary/open-food-facts-taxonomies.yml.
  - name: Price
    api: Open Prices API
    schema: Price
    key: id
  - name: Proof
