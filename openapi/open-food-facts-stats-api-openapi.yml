openapi: 3.2.0
info:
  title: Open Food Facts Stats API
  license:
    name: ' AGPL-3.0'
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  version: '1.0'
  description: 'Operations tagged Stats across 2 of this provider''s published API definitions: open-food-facts-nutripatrol-openapi.json, open-food-facts-open-prices-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Stats
paths:
  /api/v1/stats:
    get:
      summary: Get Stats
      description: 'Get number of tickets by status for the last n days.


        Args:

        n_days (int): The number of days from which to fetch ticket data.

        Default is 31 days.'
      operationId: get_stats_api_v1_stats_get
      parameters:
      - name: n_days
        in: query
        required: false
        schema:
          type: integer
          default: 31
          title: N Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Stats
components:
  schemas:
    StatsResponse:
      properties:
        total_tickets:
          type: integer
          title: Total Tickets
          description: Total number of tickets in the database
        tickets_by_status:
          additionalProperties: true
          type: object
          title: Tickets By Status
          description: A dictionary with ticket status as keys and the count of tickets as values
        tickets_by_flavor:
          additionalProperties: true
          type: object
          title: Tickets By Flavor
          description: A dictionary with ticket flavor as keys and the count of tickets as values
        tickets_by_type:
          additionalProperties: true
          type: object
          title: Tickets By Type
          description: A dictionary with ticket type as keys and the count of tickets as values
        n_days:
          type: integer
          title: N Days
          description: The number of days for which the data is fetched
        start_date:
          type: string
          title: Start Date
          description: The start date of the data range in ISO format
        end_date:
          type: string
          title: End Date
          description: The end date of the data range in ISO format
      type: object
      required:
      - total_tickets
      - tickets_by_status
      - tickets_by_flavor
      - tickets_by_type
      - n_days
      - start_date
      - end_date
      title: StatsResponse
      description: Response model for get_stats endpoint.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
