openapi: 3.2.0
info:
  title: Open Food Facts Taxonomy API
  version: '1.0'
  description: 'Operations tagged Taxonomy across 2 of this provider''s published API definitions: open-food-facts-api-v3-openapi.yml, open-food-facts-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://world.openfoodfacts.org
  description: prod
- description: dev
  url: https://world.openfoodfacts.net
- url: https://{country}.openfoodfacts.org
  description: Country-specific instance
  variables:
    country:
      default: world
      description: Country subdomain (e.g., us, fr, de)
tags:
- name: Taxonomy
  description: Endpoints for retrieving taxonomy suggestions and data.
paths:
  /api/v3/taxonomy_canonicalize_tags:
    get:
      summary: Get canonical tags for a list of local tags
      description: 'Open Food Facts uses multilingual taxonomies to normalize entries for categories, labels, ingredients, packaging shapes / materials / recycling instructions and many more fields.


        This API returns the canonical tags corresponding to a list of local tags in a given language.


        For instance, the local French ingredient tag "sucre" corresponds to the canonical tag "en:sugar".'
      tags:
      - Taxonomy
      operationId: get-api-v3-taxonomy-canonicalize-tags
      parameters:
      - name: tagtype
        in: query
        required: true
        description: The type of taxonomy to canonicalize tags for (e.g., ingredients, categories).
        schema:
          type: string
          example: ingredients
      - name: local_tags_list
        in: query
        required: true
        description: A comma-separated list of local tags to canonicalize.
        schema:
          type: string
          example: sucre,eau
      - name: lc
        in: query
        required: false
        description: '2-letter code of the language of the user. Used for localizing some fields in returned values.

          If not passed, the language may be inferred by the subdomain of the request.

          '
        schema:
          type: string
          example: fr
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - title: Response status
                  type: object
                  description: A response object to describe if a READ or WRITE request was successful or not, and if there were errors or warnings, and what the impact of those errors or warnings was.
                  examples:
                  - status: success_with_errors
                    result:
                      id: product_updated
                      name: Product updated
                      lc_name: Produit mis à jour
                    errors:
                    - message:
                        id: sugars_higher_than_carbohydrates
                        name: Sugars higher than carbohydrates
                        lc_name: Sucres plus élevés que les glucides
                        description: Sugars (40g) are higher than carbohydrates (35g).
                        lc_description: Les sucres (40g) sont plus élévés que les glucdes.
                      field:
                        id: nutriment.sugars
                        value: '40'
                      impact:
                        id: nutrients_not_updated
                        name: Nutrients not updated
                        lc_name: Nutriments non mis à jour
                        description: The nutrients were not updated.
                        lc_description: Les nutriments n'ont pas été mis à jour.
                  properties:
                    status:
                      type: string
                      enum:
                      - success
                      - success_with_warnings
                      - success_with_errors
                      - failure
                      description: 'Overall status of the request: whether it failed or succeeded, with or without warnings or errors.'
                    result:
                      type: object
                      description: 'Overall result

                        of the request (e.g. a product has been created)'
                      properties:
                        id:
                          type: string
                          description: Identifier of a response result entry
                        name:
                          type: string
                          description: Name of the response result entry in English.
                        lc_name:
                          type: string
                          description: Name of the response result entry in the language specified in tags_lc, if supplied.
                    warnings:
                      type: array
                      description: List of warnings. Warnings are used to alert about something that may be wrong, but is not necessarily wrong (e.g. a nutrient value that is unexpectedly high).
                      items:
                        title: Warning or error message
                        x-stoplight:
                          id: eakkz8p7qfoj0
                        type: object
                        description: Describes a warning or error for a READ or WRITE request, which field triggered it, and what the impact was (e.g. the field was ignored).
                        examples:
                        - message:
                            id: sugars_higher_than_carbohydrates
                            name: Sugars higher than carbohydrates
                            lc_name: Sucres plus élevés que les glucides
                            description: Sugars (40g) are higher than carbohydrates (35g).
                            lc_description: Les sucres (40g) sont plus élévés que les glucdes.
                          field:
                            id: nutriment.sugars
                            value: '40'
                          impact:
                            id: nutrients_not_updated
                            name: Nutrients not updated
                            lc_name: Nutriments non mis à jour
                            description: The nutrients were not updated.
                            lc_description: Les nutriments n'ont pas été mis à jour.
                        properties:
                          message:
                            type: object
                            properties:
                              id:
                                type: string
                                description: 'Identifier of a response message.

                                  '
                              name:
                                type: string
                                description: Name of the response message entry in English.
                              lc_name:
                                type: string
                                description: Name of the response message entry in the language specified in tags_lc, if supplied.
                              description:
                                type: string
                                description: Description of the problem specific to the request, in English.
                              lc_description:
                                type: string
                                description: Description of the problem specific to the request, in the language specified in tags_lc, if supplied.
                          field:
                            type: object
                            description: Field that triggered the warning or error.
                            properties:
                              id:
                                type: string
                                description: Name of the field that triggered the warning or error.
                              value:
                                type: string
                                description: Value of the field that triggered the warning or error.
                          impact:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              lc_name:
                                type: string
                              description:
                                type: string
                              lc_description:
                                type: string
                    errors:
                      type: array
                      description: List of errors. Errors are used to alert about something that is definitely wrong (e.g. a nutrient value that is impossibly high).
                      items:
                        title: Warning or error message
                        x-stoplight:
                          id: eakkz8p7qfoj0
                        type: object
                        description: Describes a warning or error for a READ or WRITE request, which field triggered it, and what the impact was (e.g. the field was ignored).
                        examples:
                        - message:
                            id: sugars_higher_than_carbohydrates
                            name: Sugars higher than carbohydrates
                            lc_name: Sucres plus élevés que les glucides
                            description: Sugars (40g) are higher than carbohydrates (35g).
                            lc_description: Les sucres (40g) sont plus élévés que les glucdes.
                          field:
                            id: nutriment.sugars
                            value: '40'
                          impact:
                            id: nutrients_not_updated
                            name: Nutrients not updated
                            lc_name: Nutriments non mis à jour
                            description: The nutrients were not updated.
                            lc_description: Les nutriments n'ont pas été mis à jour.
                        properties:
                          message:
                            type: object
                            properties:
                              id:
                                type: string
                                description: 'Identifier of a response message.

                                  '
                              name:
                                type: string
                                description: Name of the response message entry in English.
                              lc_name:
                                type: string
                                description: Name of the response message entry in the language specified in tags_lc, if supplied.
                              description:
                                type: string
                                description: Description of the problem specific to the request, in English.
                              lc_description:
                                type: string
                                description: Description of the problem specific to the request, in the language specified in tags_lc, if supplied.
                          field:
                            type: object
                            description: Field that triggered the warning or error.
                            properties:
                              id:
                                type: string
                                description: Name of the field that triggered the warning or error.
                              value:
                                type: string
                                description: Value of the field that triggered the warning or error.
                          impact:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              lc_name:
                                type: string
                              description:
                                type: string
                              lc_description:
                                type: string
                - type: object
                  properties:
                    canonical_tags_list:
                      type: string
                      example: en:sugar,en:water
      security:
      - userAgentAuth: []
    servers:
    - url: https://world.openfoodfacts.org
      description: prod
    - description: dev
      url: https://world.openfoodfacts.net
