openapi: 3.1.0
info:
  title: Open Food Facts Cgi Search API
  description: Open Food Facts is a collaborative, free, and open database of food products from around the world. The HTTP API provides read access to product data by barcode, full-text and faceted search, and access to Open Food Facts taxonomies.
  version: '2.0'
  contact:
    name: Open Food Facts
    url: https://world.openfoodfacts.org/
    email: reuse@openfoodfacts.org
  license:
    name: Open Database License (ODbL)
    url: https://opendatacommons.org/licenses/odbl/1-0/
servers:
- url: https://world.openfoodfacts.org
  description: Worldwide instance
- url: https://{country}.openfoodfacts.org
  description: Country-specific instance
  variables:
    country:
      default: world
      description: Country subdomain (e.g., us, fr, de)
tags:
- name: Search
paths:
  /api/v2/search:
    get:
      summary: Search products
      description: Faceted product search supporting filters by category, brand, label, country, ingredient, additive, allergen, nutrition grade, and bulk barcode lookup.
      operationId: searchProducts
      parameters:
      - name: code
        in: query
        schema:
          type: string
        description: Comma-separated list of barcodes for bulk lookup.
      - name: categories_tags_en
        in: query
        schema:
          type: string
      - name: brands_tags
        in: query
        schema:
          type: string
      - name: labels_tags
        in: query
        schema:
          type: string
      - name: countries_tags_en
        in: query
        schema:
          type: string
      - name: nutrition_grades_tags
        in: query
        schema:
          type: string
      - name: fields
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
      - name: page_size
        in: query
        schema:
          type: integer
          maximum: 1000
      - name: sort_by
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Paginated product results.
      tags:
      - Search
