openapi: 3.2.0
info:
  title: Open Food Facts open-prices REST Price Tags API
  version: 0.0.0 (api)
  description: Open Prices API allows you to add product prices
  contact:
    name: The Open Food Facts team
    url: https://world.openfoodfacts.org
    email: contact@openfoodfacts.org
  license:
    name: ' AGPL-3.0'
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
tags:
- name: price-tags
paths:
  /api/v1/price-tags:
    get:
      operationId: price_tags_list
      parameters:
      - in: query
        name: created__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created__lte
        schema:
          type: string
          format: date-time
      - name: order_by
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: prediction_count
        schema:
          type: integer
      - in: query
        name: prediction_count__gte
        schema:
          type: integer
      - in: query
        name: prediction_count__lte
        schema:
          type: integer
      - in: query
        name: price_id
        schema:
          type: integer
      - in: query
        name: proof__location__osm_address_country_code
        schema:
          type: string
      - in: query
        name: proof__owner
        schema:
          type: string
      - in: query
        name: proof__ready_for_price_tag_validation
        schema:
          type: boolean
      - in: query
        name: proof_id
        schema:
          type: integer
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type:
          - integer
          - 'null'
          enum:
          - 0
          - 1
          - 10
          - 2
          - 3
          - 4
          - 5
        description: 'The annotation status


          * `0` - deleted

          * `1` - linked_to_price

          * `2` - not_readable

          * `3` - truncated

          * `4` - not_price_tag

          * `5` - no_barcode

          * `10` - other'
      - in: query
        name: status__isnull
        schema:
          type: boolean
      - in: query
        name: tags__contains
        schema:
          type: string
      - in: query
        name: tags__not_contains
        schema:
          type: string
      tags:
      - price-tags
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPriceTagFullList'
          description: ''
      summary: Price tags list
      x-summary-source: derived
    post:
      operationId: price_tags_create
      tags:
      - price-tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceTagCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PriceTagCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PriceTagCreate'
        required: true
      security:
      - CustomAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceTagCreate'
          description: ''
      summary: Price tags create
      x-summary-source: derived
  /api/v1/price-tags/{id}:
    get:
      operationId: price_tags_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Price Tag.
        required: true
      tags:
      - price-tags
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceTagFull'
          description: ''
      summary: Price tags retrieve
      x-summary-source: derived
    patch:
      operationId: price_tags_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Price Tag.
        required: true
      tags:
      - price-tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPriceTagUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPriceTagUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPriceTagUpdate'
      security:
      - CustomAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceTagUpdate'
          description: ''
      summary: Price tags partial update
      x-summary-source: derived
    delete:
      operationId: price_tags_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Price Tag.
        required: true
      tags:
      - price-tags
      security:
      - CustomAuthentication: []
      responses:
        '204':
          description: No response body
      summary: Price tags destroy
      x-summary-source: derived
