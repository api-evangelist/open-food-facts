      type: object
      properties:
        bounding_box:
          type: array
          items:
            type: number
            format: double
          description: Coordinates of the bounding box, in the format [y_min, x_min, y_max, x_max]
        status:
          description: 'The annotation status


            * `0` - deleted

            * `1` - linked_to_price

            * `2` - not_readable

            * `3` - truncated

            * `4` - not_price_tag

            * `5` - no_barcode

            * `10` - other'
          minimum: -2147483648
          maximum: 2147483647
          oneOf:
          - $ref: '#/components/schemas/PriceTagStatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        price_id:
          type: integer
        proof_id:
          type: integer
      required:
      - bounding_box
      - proof_id
    ProofTypeEnum:
      enum:
      - PRICE_TAG
      - RECEIPT
      - GDPR_REQUEST
      - SHOP_IMPORT
      type: string
      description: '* `PRICE_TAG` - PRICE_TAG

        * `RECEIPT` - RECEIPT

        * `GDPR_REQUEST` - GDPR_REQUEST

        * `SHOP_IMPORT` - SHOP_IMPORT'
    PriceTagStatusEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 10
      type: integer
      description: '* `0` - deleted

        * `1` - linked_to_price

        * `2` - not_readable

        * `3` - truncated

        * `4` - not_price_tag

        * `5` - no_barcode

        * `10` - other'
    LocationOsmTypeEnum:
      enum:
      - NODE
      - WAY
      - RELATION
      type: string
      description: '* `NODE` - NODE

        * `WAY` - WAY

        * `RELATION` - RELATION'
    PriceTagPrediction:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/PriceTagPredictionTypeEnum'
          description: 'The type of the prediction


            * `PRICE_TAG_EXTRACTION` - PRICE_TAG_EXTRACTION

            * `PRICE_TAG_CLF` - PRICE_TAG_CLF'
        model_name:
          type: string
          description: The name of the model that generated the prediction
          maxLength: 30
        model_version:
          type: string
          description: The specific version of the model that generated the prediction
          maxLength: 30
        schema_version:
          type:
          - string
          - 'null'
          description: The schema version of the prediction data. Used to handle changes in the prediction data structure. It is currently used when calling Gemini API to extract price tags.
          maxLength: 20
        data:
          description: a dict representing the data of the prediction. This field is model-specific.
        created:
          type: string
          format: date-time
          description: When the prediction was created in DB
      required:
      - model_name
      - model_version
      - type
    Location:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        osm_brand_logo_url:
          type: string
          readOnly: true
        type:
          $ref: '#/components/schemas/LocationTypeEnum'
        osm_id:
          type:
          - integer
          - 'null'
