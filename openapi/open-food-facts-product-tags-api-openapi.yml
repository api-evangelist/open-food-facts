openapi: 3.2.0
info:
  title: Open Food Facts folksonomy REST Product Tags API
  description: 'Folksonomy Engine API allows you to add free property/value pairs to Open Food Facts products.


    The API use the main following variables:

    * **product**: the product number

    * **k**: "key", meaning the property or tag

    * **v**: "value", the value for a related key


    ## See also


    * Project page

    * Folksonomy Engine github repository

    * Documented properties'
  version: 0.1.0
servers:
- url: https://api.folksonomy.openfoodfacts.org
  description: Production server
- url: http://localhost:8000
  description: Local development server
tags:
- name: Product Tags
  description: CRUD operations for product tags and properties
paths:
  /product/{product}:
    get:
      tags:
      - Product Tags
      summary: Product Tags List
      description: Get a list of existing tags for a product, optionally filtering by specific keys.
      operationId: product_tags_list_product__product__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: product
        in: path
        required: true
        schema:
          type: string
          title: Product
      - name: owner
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Owner
      - name: keys
        in: query
        required: false
        schema:
          type: string
          description: Comma-separated list of keys to filter by. If not provided, all keys are returned.
          title: Keys
        description: Comma-separated list of keys to filter by. If not provided, all keys are returned.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductTag'
                title: Response Product Tags List Product  Product  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /product/{product}/{k}:
    get:
      tags:
      - Product Tags
      summary: Product Tag
      description: 'Get a specific tag or tag hierarchy on a product


        - /product/xxx/key returns only the requested key

        - /product/xxx/key* returns the key and subkeys (key:subkey)'
      operationId: product_tag_product__product___k__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: product
        in: path
        required: true
        schema:
          type: string
          title: Product
      - name: k
        in: path
        required: true
        schema:
          type: string
          title: K
      - name: owner
        in: query
        required: false
        schema:
          default: ''
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductTag'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Product Tags
      summary: Product Tag Delete
      description: Delete a product tag
      operationId: product_tag_delete_product__product___k__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: product
        in: path
        required: true
        schema:
          type: string
          title: Product
      - name: k
        in: path
        required: true
        schema:
          type: string
          title: K
      - name: version
        in: query
        required: true
        schema:
          type: integer
          title: Version
      - name: owner
        in: query
        required: false
        schema:
          default: ''
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /product/{product}/{k}/versions:
    get:
      tags:
      - Product Tags
      summary: Product Tag List Versions
      description: Get a list of all versions of a tag for a product
      operationId: product_tag_list_versions_product__product___k__versions_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: product
        in: path
        required: true
        schema:
          type: string
          title: Product
      - name: k
        in: path
        required: true
        schema:
          type: string
          title: K
      - name: owner
        in: query
        required: false
        schema:
          default: ''
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductTag'
                title: Response Product Tag List Versions Product  Product   K  Versions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /product:
    put:
      tags:
      - Product Tags
      summary: Product Tag Update
      description: 'Update a product tag


        - **product**: which product

        - **k**: which key for the tag

        - **v**: which value to set for the tag

        - **version**: must be equal to previous version + 1

        - **owner**: None or empty for public tags, or your own user_id'
      operationId: product_tag_update_product_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductTag'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - Product Tags
      summary: Product Tag Add
      description: 'Create a new product tag (version=1)


        - **product**: which product

        - **k**: which key for the tag

        - **v**: which value to set for the tag

        - **version**: none or empty or 1

        - **owner**: none or empty for public tags, or your own user_id


        Be aware it''s not possible to create the same tag twice. Though, you can update

        a tag and add multiple values the way you want (don''t forget to document how); comma

        separated list is a good option.'
      operationId: product_tag_add_product_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductTag'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ProductTag:
      properties:
        product:
          type: string
          title: Product
        k:
          type: string
          title: K
        v:
          type: string
          title: V
        owner:
          type: string
          title: Owner
          default: ''
        version:
          type: integer
          title: Version
          default: 1
        editor:
          anyOf:
          - type: string
          - type: 'null'
          title: Editor
        last_edit:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Edit
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
          default: ''
      type: object
      required:
      - product
      - k
      - v
      title: ProductTag
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: auth
