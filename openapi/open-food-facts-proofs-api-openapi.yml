  /api/v1/proofs/drafts/{id}:
    get:
      operationId: proofs_drafts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Proof.
        required: true
      tags:
      - proofs
      security:
      - CustomAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofFull'
          description: ''
      summary: Proofs drafts retrieve
      x-summary-source: derived
    patch:
      operationId: proofs_drafts_partial_update
      description: Finalize a draft proof - set draft=False and add full metadata.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Proof.
        required: true
      tags:
      - proofs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProofUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProofUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProofUpdate'
      security:
      - CustomAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofFull'
          description: ''
      summary: Proofs drafts partial update
      x-summary-source: derived
    delete:
      operationId: proofs_drafts_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Proof.
        required: true
      tags:
      - proofs
      security:
      - CustomAuthentication: []
      responses:
        '204':
          description: No response body
      summary: Proofs drafts destroy
      x-summary-source: derived
  /api/v1/proofs/drafts/{id}/anonymize:
    post:
      operationId: proofs_drafts_anonymize_create
      description: Anonymize a receipt.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Proof.
        required: true
      tags:
      - proofs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftProofAnonymizeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DraftProofAnonymizeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DraftProofAnonymizeRequest'
        required: true
      security:
      - CustomAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofFull'
          description: ''
      summary: Proofs drafts anonymize create
      x-summary-source: derived
  /api/v1/proofs/drafts/upload:
    post:
      operationId: proofs_drafts_upload_create
      description: 'Upload a draft proof.


        Only the file and type fields are expected. ML models runs immediately asynchronously.'
      tags:
      - proofs
      requestBody:
        content:
          multipart/form-data:
