          $ref: '#/components/schemas/ProofTypeEnum'
        image_md5_hash:
          type:
          - string
          - 'null'
          maxLength: 32
        image_thumb_path:
          type:
          - string
          - 'null'
        location_osm_id:
          type:
          - integer
          - 'null'
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        location_osm_type:
          oneOf:
          - $ref: '#/components/schemas/LocationOsmTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        date:
          type:
          - string
          - 'null'
          format: date
        currency:
          oneOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
