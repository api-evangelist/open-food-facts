  /api/v1/proofs/{id}:
    get:
      operationId: proofs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Proof.
        required: true
      tags:
      - proofs
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofFull'
          description: ''
      summary: Proofs retrieve
      x-summary-source: derived
    patch:
      operationId: proofs_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Proof.
        required: true
      tags:
      - proofs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProofUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProofUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProofUpdate'
      security:
      - CustomAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofUpdate'
          description: ''
      summary: Proofs partial update
      x-summary-source: derived
    delete:
      operationId: proofs_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Proof.
        required: true
      tags:
      - proofs
      security:
      - CustomAuthentication: []
      responses:
        '204':
          description: No response body
      summary: Proofs destroy
      x-summary-source: derived
