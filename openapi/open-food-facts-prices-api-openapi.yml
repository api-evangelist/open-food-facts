          - number
          - 'null'
          format: double
          minimum: 0
          exclusiveMaximum: 10000000
        price_is_discounted:
          type: boolean
        price_without_discount:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          exclusiveMaximum: 10000000
        discount_type:
          oneOf:
          - $ref: '#/components/schemas/DiscountTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        price_per:
