    PaginatedPriceHistoryList:
      type: object
      required:
      - items
      - page
      - pages
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PriceHistory'
        page:
          type: integer
          description: Current page number
          example: 1
        pages:
          type: integer
          description: Total number of pages
          example: 16
        size:
          type: integer
          description: Number of items per page
          example: 100
        total:
          type: integer
          description: Total number of items
          example: 1531
    Location:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        osm_brand_logo_url:
          type: string
          readOnly: true
        type:
          $ref: '#/components/schemas/LocationTypeEnum'
        osm_id:
          type:
          - integer
          - 'null'
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        osm_type:
          oneOf:
          - $ref: '#/components/schemas/LocationOsmTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        osm_name:
          type:
          - string
          - 'null'
        osm_display_name:
          type:
          - string
          - 'null'
        osm_tag_key:
          type:
          - string
          - 'null'
        osm_tag_value:
          type:
          - string
          - 'null'
        osm_brand:
          type:
          - string
          - 'null'
        osm_address_postcode:
          type:
          - string
          - 'null'
        osm_address_city:
          type:
          - string
          - 'null'
        osm_address_country:
          type:
          - string
          - 'null'
        osm_address_country_code:
          type:
          - string
          - 'null'
        osm_lat:
          type:
          - number
          - 'null'
          format: double
          exclusiveMinimum: -10000
          exclusiveMaximum: 10000
        osm_lon:
          type:
          - number
          - 'null'
          format: double
          exclusiveMinimum: -10000
          exclusiveMaximum: 10000
        osm_version:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
        osm_version_date:
          type:
          - string
          - 'null'
          format: date-time
        website_url:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 200
        price_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        user_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        product_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        proof_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        source:
          type:
          - string
          - 'null'
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - osm_brand_logo_url
      - type
      - updated
  securitySchemes:
    CustomAuthentication:
      type: http
      scheme: bearer
