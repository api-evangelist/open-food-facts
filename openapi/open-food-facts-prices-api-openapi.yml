          description: ''
      summary: Prices list
      x-summary-source: derived
    post:
      operationId: prices_create
      tags:
      - Prices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PriceCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PriceCreate'
        required: true
      security:
      - CustomAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceCreate'
          description: ''
      summary: Prices create
      x-summary-source: derived
  /api/v1/prices/{id}:
    get:
