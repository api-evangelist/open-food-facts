        schema:
          type: string
      - in: query
        name: product__categories_tags__overlap
        schema:
          type: array
          items:
            type: array
            items:
              type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: product__source
        schema:
          type:
          - string
          - 'null'
          enum:
          - obf
          - 'off'
          - opf
          - opff
        description: '* `off` - off

          * `obf` - obf

          * `opff` - opff

          * `opf` - opf'
      - in: query
        name: product__source__isnull
        schema:
          type: boolean
      - in: query
        name: product_code
        schema:
          type: string
      - in: query
        name: product_code__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: product_code__isnull
        schema:
          type: boolean
      - in: query
        name: product_id
        schema:
          type: integer
      - in: query
        name: product_id__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: product_id__isnull
        schema:
          type: boolean
      - in: query
        name: product_name
        schema:
          type: string
      - in: query
