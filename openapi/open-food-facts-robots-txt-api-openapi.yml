openapi: 3.2.0
info:
  title: Open Food Facts Robots.txt API
  version: 0.1.0
  contact:
    name: The Open Food Facts team
    url: https://world.openfoodfacts.org/
    email: contact@openfoodfacts.org
  license:
    name: ' AGPL-3.0'
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  description: 'Operations tagged Robots.txt across 2 of this provider''s published API definitions: open-food-facts-nutripatrol-openapi.json, open-food-facts-search-a-licious-openapi.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Robots.txt
paths:
  /robots.txt:
    get:
      summary: Robots Txt
      operationId: robots_txt_robots_txt_get
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
      tags:
      - Robots.txt
x-refined-from:
- open-food-facts-nutripatrol-openapi.json
- open-food-facts-search-a-licious-openapi.json
