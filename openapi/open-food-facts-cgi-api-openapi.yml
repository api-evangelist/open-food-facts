openapi: 3.1.0
info:
  title: Open Food Facts Cgi API
  description: Open Food Facts is a collaborative, free, and open database of food products from around the world. The HTTP API provides read access to product data by barcode, full-text and faceted search, and access to Open Food Facts taxonomies.
  version: '2.0'
  contact:
    name: Open Food Facts
    url: https://world.openfoodfacts.org/
    email: reuse@openfoodfacts.org
  license:
    name: Open Database License (ODbL)
    url: https://opendatacommons.org/licenses/odbl/1-0/
servers:
- url: https://world.openfoodfacts.org
  description: Worldwide instance
- url: https://{country}.openfoodfacts.org
  description: Country-specific instance
  variables:
    country:
      default: world
      description: Country subdomain (e.g., us, fr, de)
tags:
- name: Cgi
paths:
  /cgi/suggest.pl:
    get:
      summary: Legacy suggestion endpoint
      description: Legacy CGI endpoint for taxonomy suggestions.
      operationId: legacySuggest
      parameters:
      - name: tagtype
        in: query
        required: true
        schema:
          type: string
      - name: term
        in: query
        schema:
          type: string
      responses:
        '200':
          description: List of suggestions.
      tags:
      - Cgi
