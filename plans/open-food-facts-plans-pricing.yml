description: >-
  Open Food Facts publishes no priced plans. The API and the whole database are free to use under the Open
  Database License; there are no tiers, no quotas sold, no API keys and no billing surface. Access is
  governed by the published per-IP rate limits and the User-Agent identification requirement, not by a plan.
  This REPLACES the 2026-05-04 scaffold, which invented "Free" and "Professional" tiers with request quotas
  and prices the provider has never published.
