aid: open-food-facts
name: Open Food Facts
description: >-
  Open Food Facts is a collaborative, free and open database of food products from around the world, built by
  everyone for everyone. Anyone can scan a barcode and contribute product data, and the whole database is
  published under the Open Database License so it can be re-used for any purpose. The project publishes a
  documented public HTTP API for reading and writing product data, plus a family of companion services —
  Open Prices, Search-a-licious full-text search, the Folksonomy engine, facet knowledge panels and the
  NutriPatrol moderation API — alongside official SDKs in Python, JavaScript, Dart, Ruby, PHP and Go.
