domain_standards:
  - id: gs1-gtin
    name: GS1 GTIN / EAN-13 / UPC product identification
    conforms: true
    detail: >-
      The whole product surface is keyed on the GS1 barcode. The `code` path parameter is defined in the
      contract as an EAN-13/UPC barcode, the project publishes a barcode-normalization reference describing
      how leading zeros and short codes are canonicalized to EAN-13, and product schema version 999 was a
      breaking change to exactly that normalization. A buyer who already speaks GTIN integrates with no
      bespoke identifier mapping.
    evidence:
      - openapi/open-food-facts-api-v2-openapi.yml#/paths/~1api~1v2~1product~1{code}/get/parameters
      - https://openfoodfacts.github.io/openfoodfacts-server/api/ref-barcode-normalization/
  - id: odbl-open-data
    name: Open Database License (ODbL 1.0) / DbCL
    conforms: true
    detail: >-
      Declared in the contract itself — info.license is "data: ODbL" with x-identifier ODbL-1.0 — not merely
      claimed on a marketing page. Product images are CC BY-SA.
    evidence: openapi/open-food-facts-api-v2-openapi.yml#/info/license
  - id: nutri-score
    name: Nutri-Score front-of-pack nutrition label
    conforms: true
    detail: >-
      The contract exposes the official French/European Nutri-Score grade and score as first-class product
      schema fields (Product-Nutriscore), computed to the published national algorithm rather than a
      bespoke rating.
    evidence: openapi/open-food-facts-api-v2-openapi.yml#/components/schemas/Product-Nutriscore
  - id: nova
    name: NOVA food processing classification
    conforms: true
    detail: >-
      The NOVA 1-4 food-processing group is carried on the product schema in both v2 and v3, matching the
      published academic classification used in nutrition policy.
    evidence: openapi/open-food-facts-api-v3-openapi.yml
  - id: openstreetmap-ids
    name: OpenStreetMap node/way identifiers
    conforms: true
    detail: >-
      Open Prices addresses physical stores by their OpenStreetMap type and id
      (/api/v1/locations/osm/{osm_type}/{osm_id}) rather than by a proprietary location key.
    evidence: openapi/open-food-facts-open-prices-openapi.yml
compliance_programs:
  published: false
  detail: >-
    Open Food Facts is a French non-profit association and publishes no SOC 2, ISO 27001, PCI or HIPAA
    attestation, and no trust center. probe-security-programs.py found no trust center on 2026-09-17. No
    Compliance pointer is emitted, because there is nothing published to point at.
